# MySQL 数据库配置文件
# Docker 容器内配置 — MySQL host 使用 Compose 服务名

database:
  mysql:
    host: mysql          # Docker Compose 服务名
    port: 3306
    database: web_word_db
    user: web_word_user
    password: "webword123"  # 与 docker-compose.yml MYSQL_PASSWORD 一致
    charset: utf8mb4
    collation: utf8mb4_unicode_ci

  # 连接池配置
  pool:
    size: 5
    max_overflow: 10


# 应用配置
app:
  model:
    provider: zhipu  # zhipu, openai, deepseek
    model_name: glm-4.7-flash
    api_key_env: ZHIPU_API_KEY  # Read from environment variable

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
