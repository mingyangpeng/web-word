# ═══ Apple 设计语言主题（批次 21-2）：原生控件（radio/checkbox/slider/
# primary 按钮/焦点/进度）全部走 primaryColor——单一强调色 Apple Blue
# #0071E3（白字 4.7:1 ✓）。design_system.get_global_theme_css 在此之上做
# 装饰层（圆角/阴影/布局），两者色值一致。
[theme]
primaryColor = "#0071E3"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
font = "sans serif"

[server]
headless = true
port = 8501

# 让主脚本同级的 src/static/ 目录可通过 /app/static/<file> 访问。
# 交互式知识图谱要加载 vis-network（约 700KB），把它放进 static/ 从本地服务，
# 而不是引 CDN —— 本项目已确立「零网络依赖」原则（灌库脚本、离线降级同理），
# 内网或断网环境下 CDN 会渲染成一片空白。
enableStaticServing = true

[client]
showErrorDetails = false  # 生产：false（配合服务端日志）；开发调试临时改 true
