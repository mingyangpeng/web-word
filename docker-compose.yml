version: '3.8'

services:
  web:
    build: .
    ports:
      - "8501:8501"
    environment:
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - MYSQL_HOST=host.docker.internal
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=web_word_db
      - MYSQL_USER=web_word_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
