services:
  mysql:
    image: mysql:8.0
    container_name: web-word-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass123}
      MYSQL_DATABASE: web_word_db
      MYSQL_USER: web_word_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-webword123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass123}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build: .
    container_name: web-word-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      # .env 已随仓库分发：AI key / 模型 / LLM_PROVIDER 从这里进容器
      - .env
    environment:
      # 应用读的是 ZHIPUAI_API_KEY（见 src/llm_api.py）。env_file 已带 key/
      # ZHIPUAI_BASE_URL/ZHIPUAI_MODEL；这里强制 MYSQL_HOST=mysql（容器网络名），
      # 覆盖 .env 里的 127.0.0.1 —— environment 优先级高于 env_file。
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-glm-4}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=web_word_db
      - MYSQL_USER=web_word_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-webword123}
    extra_hosts:
      # 让容器内的 host.docker.internal 指向宿主机，便于连宿主机的 MySQL
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    name: web-word-mysql-data
  app_data:
    name: web-word-app-data
