# ============================================================
# 范畴包③模板：图式体系——义位按什么归类
# 用法：按本范畴理论替换图式占位值；字段含义见 docs/p1/跨词类通用框架.md §2③。
# 约束：图式是封闭清单（不得新增）；evidence_slots 的每个槽位 code 必须在
#       corpus_map.yaml 的 slots 里定义；annotation.mode 必须定义。
# ============================================================
version: 1.0
category: TEMPLATE_CATEGORY

# 图式是封闭清单：标注时 N 选一，不得新增（理论承诺）
# 每个图式 = 语义重心定义 + 证据面（在哪个语法槽位找证据）
schemas:
  - code: SCHEMA_1
    name: 请填写图式名
    definition: 请填写语义重心定义
    classic_examples: [example1, example2]
    evidence_slots:            # 槽位代码见 corpus_map.yaml 的 slots 枚举
      - SLOT_1
      - SLOT_2
  - code: SCHEMA_2
    name: 请填写图式名
    definition: 请填写语义重心定义
    classic_examples: [example1, example2]
    evidence_slots: [SLOT_3]

annotation:
  mode: forced_choice          # N 选一
  secondary_schema: record     # 次要图式记入备注（供辐射网络）
  domain_merging:              # 图式→域的归并假设（可被义位层重聚类推翻）
    domains:
      - {name: 请填写域名, families: [SCHEMA_1, SCHEMA_2]}

# ============================================================
# 模板拼装节（template_assembly）：释义模板引擎（src/template_engine.py）
# 的槽位拼装配置 —— 批次 10 R-1 收口后拼装表外置到范畴包（本节），
# 引擎只保留「特征取值 → 槽位词面」的通用拼装规则（零词类名词）。
# ⚠️ 必填：范畴包缺本节时引擎 fail-closed（报「范畴包缺 template_assembly」，
#    不回退任何词类的拼装表）。
# 用法：按本范畴特征码研制段序与词面（成品样例参照 configs/motion 与
#       configs/speech 的同名节）；段类型 text/codes/fragments/
#       value_fragments/values/concat；修饰 joiner/prefix/suffix/
#       template({value} 占位)/fallback/split_parts/first_only/strip_prefix。
# 整句骨架：「{header}{主句各段，按 main_joiner 连接}{slots_section}」。
# ============================================================
template_assembly:
  header: "【图式：{schema}】"            # {schema} = 图式名（引擎侧占位符）
  main_joiner: "，"                       # 主句各段连接符
  slots_section: "；[可变槽位: {slots}]"  # 槽位清单整节（{slots} = 条目串）
  slots_joiner: "；"                      # 槽位条目连接符
  slots_entry: "{label}={value}"          # 单条槽位：特征 label=本义位取值标签
  slots_empty: "无（全要素簇内共享）"      # 无可变槽位时的清单词面（可按词类改）
  segments: []                            # ← 占位：按本范畴特征研制主句段序后填写
