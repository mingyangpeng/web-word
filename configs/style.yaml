# =====================================================================
# LexiSchema 词典层体例文件（style.yaml）
# =====================================================================
# 依据：docs/spec/平台架构设计规范.md（v5.1）§7 C 配置治理·词典层——
#   「style.yaml：定义词表、替换性检验、义项排列（原型梯度为主/频次校验）、
#   括注/辨析/参见、多模态位规则、可选微结构」。
# 载体纪律：改研究方案的进文件（git 评审制，谁改=研究者评审），改运营状态
#   的进界面（category_tool_settings）——本文件只装「研究方案」级硬准绳，
#   是编纂成文（工序 10–14）的一致性防线之二（§8 一致性四防线：簇承包、
#   style.yaml 硬准绳、AI 体例质检、终审抽查＋出版终检）。
# 消费方：G6 体例终检（词典管理区「出版导出」tab 验 style_version 在场）、
#   AI 体例质检提示词（§5 资源注入协议①配置规则）、词条装配
#   （entry_assembly：来源标注/辨析栏/多模态位渲染）。
# 数值口径：凡「待编者核定」者为占位——由词典管理员组织编者核定后改定，
#   改动走 git 评审（版本号递增，见 style_version）。
# =====================================================================

# 体例版本（G6 体例终检的在场硬检字段：configs/style.yaml + style_version:）
style_version: 1.0

# ---------------------------------------------------------------------
# 一、defining_vocab 定义词表约束（工序 10 释义撰写）
# ---------------------------------------------------------------------
# 参照学习词典通行做法：OALD / Longman / Collins 等学习词典均以受控定义词表
# （defining vocabulary）写释义——释义用词限定在一个规模有限、频级较高的封闭
# 词表内，超表词须回表内词改写；目的是控制释义可读性、防止循环定义（用 A 解释
# B 又用 B 解释 A），并使 AI 体例质检的「定义词表检查」（§5 质检通道）可机械执行。
# 口径：
#   * 释义正文用词原则上不出定义词表；范畴包内术语（如图式名、特征码）允许
#     以括注形式出现，不计入违例；
#   * 释义主语言为英（沿 OALD 义位行文），对译为汉（三态工序 12），定义词表
#     约束只作用于英文释义正文；
#   * 词表本体（defining_vocab.txt）与逐条白名单由编者核定后随本文件同批入
#     git（词条数先占位，见下）。
defining_vocab:
  source_practice: >-
    参照 OALD/Longman/Collins 等学习词典的 defining vocabulary 通行做法：
    受控定义词表＋超表回改＋循环定义防护（详见上方节引言）。
  vocab_size: 待编者核定          # 定义词表词条数（学习词典通行量级 2000–3000）
  vocab_file: 待编者核定          # 词表本体文件路径（如 configs/defining_vocab.txt）
  allow_gloss_terms: true         # 范畴包术语允许括注出现，不计违例
  circular_definition_check: true # 循环定义防护：A 释 B 且 B 释 A 须人工复核
  ai_audit: 体例质检-定义词表检查   # §5 质检通道挂接点（ai_proposals kind=audit）

# ---------------------------------------------------------------------
# 二、substitution_test 替换性检验标准（工序 8 分立复核 / 工序 10 释义质检）
# ---------------------------------------------------------------------
# 用途：检验两个候选义位（或两条释义）是否真的分立/可区分——把释义放回语料
#   例句做替换，替得进对方例句则分立证据弱，替不进则强（§5 质检通道
#   「替换性测试」，度量入协同度量页：替换测试通过率）。
# 判据口径（通过率阈值与抽样规模待编者核定）：
#   * 双向替换：义位 A 的释义替换进 A 自己的证据例句应自然，替换进近邻
#     义位 B 的例句应不自然（或语义显著改变）——两头都成立才算分立证据强；
#   * 抽样：每对存疑义位至少抽待编者核定条例句做替换测试；
#   * 裁决：替换不自然率 ≥ 待编者核定 → 维持分立；否则触发义项合并复核
#     （工序 8 分立复核回路）。
substitution_test:
  method: 双向替换（释义↔证据例句互换，两头判自然度）
  sample_size: 待编者核定          # 每对存疑义位的替换测试例句抽样数
  pass_threshold: 待编者核定       # 维持分立所需的替换不自然率下限
  metric: 替换测试通过率（协同度量页）

# ---------------------------------------------------------------------
# 三、sense_ordering 义项排列：原型梯度为主 / 频次校验（工序 9→14 装配）
# ---------------------------------------------------------------------
# 口径（§6 词条内容模型「义项区：原型梯度排序」）：
#   * 主排序＝原型梯度：义位在范畴内按典型性（典型性得分/母图式距离）排
#     梯度，原型居前、边缘居后——词条义项区不是历史顺序也不是频次顺序；
#   * 校验＝语料频次：同词条内相邻义项若频次排序与原型梯度倒挂显著
#     （差值超过待编者核定阈值），标注「频次异常」交编者复核，不改排序，
#     只留复核留痕；
#   * 非建模义位（沿 OALD/现汉的义项）排在建模义位之后，逐条标来源。
sense_ordering:
  primary: 原型梯度（范畴内典型性得分，原型居前）
  secondary_check: 频次校验（语料词频倒挂超阈值→「频次异常」标注交复核，不改排序）
  inversion_threshold: 待编者核定   # 频次倒挂报警阈值（频次比/秩差）
  non_modeled_last: true            # 非建模义位（OALD/现汉沿用户）排后并标来源
  coverage_note: true               # coverage 如实标注（试点 32→352→996 阶梯）

# ---------------------------------------------------------------------
# 四、microstructure 微结构：括注 / 用法说明 / 辨析栏 / 参见规则（工序 13–14）
# ---------------------------------------------------------------------
# 词条内部构件的在场与格式规则（§6 成品词条内容模型）：
microstructure:
  bracket_note:                     # 括注（义位级语法/语域标注格式）
    format: 全角圆括号，置于词性之后、释义之前
    content: 句型代号（继承 OALD）·语域标签（定制属性语域字段联动）
    optional: true
  usage_note:                       # 用法说明
    trigger: 替换测试不自然率高 / 语域受限 / 搭配受限的义位必配
    max_len_chars: 待编者核定
    optional: true
  discrimination_box:               # 辨析栏（同簇才有）
    presence: 同簇义位 ≥ 待编者核定 个的词条必配
    content: 同簇英汉对照（簇内逐义位一行：释义＋典型例证差异点）
    optional: false                 # 满足触发条件即必配（false=非全词条必配）
  cross_reference:                  # 参见规则（§6：同簇互见/反义/图式同源）
    kinds: [同簇互见, 反义, 图式同源]
    format: 「参见 ×××」置于词条末区，反义与图式同源可多条
  etymology_bar:                    # 词源栏（可选微结构，本表决定）
    enabled: false                  # 阶段 2 默认关闭；启用须走体例工单
  custom_attributes: true           # 定制属性区（项目自定义字段，装配层渲染）

# ---------------------------------------------------------------------
# 五、multimedia 多模态位规则（工序 11 例证配置含多模态 / 装配渲染）
# ---------------------------------------------------------------------
# 多模态区三个展示位（§6：释义配图 · 动作视频示范 · 图式示意图；
# style.yaml 位规则——什么锚允许挂什么位、缺位如何降级）：
multimedia:
  slots:
    illustration:                   # 释义配图（image，词目/义位锚）
      anchor: [word, sense]
      missing_policy: 缺位静默（该位不渲染，不占位不报错）
    action_video:                   # 动作视频示范（video，义位锚优先）
      anchor: [sense, example]
      missing_policy: 缺位静默
    schema_diagram:                 # 图式示意图（image，图式锚）
      anchor: [schema]
      missing_policy: 缺位静默
  example_media:                    # 例证媒体（caption＋来源必填，§6 例证区）
    caption_required: true
    source_required: true
  license_gate: 无许可（media_assets.license 空）不入库、不入装配——D⑥ 许可纪律
  pronunciation: TTS 自产或授权音频（阶段 2 项，位规则预留）
